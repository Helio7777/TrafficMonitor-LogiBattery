name: Device support request
description: Request support for a new Logitech or MCHOSE model
title: "[Device]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Provide only the minimum information needed for interoperability. Do not upload firmware, full device paths, serial numbers, or raw captures.
  - type: input
    id: model
    attributes:
      label: Manufacturer and exact model
      placeholder: MCHOSE G3 A
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection mode
      options:
        - 2.4 GHz receiver
        - USB cable
        - Bluetooth
        - Other
    validations:
      required: true
  - type: input
    id: identifiers
    attributes:
      label: VID and PID
      description: Hexadecimal VID/PID only; do not include the full device path.
      placeholder: A8A5:2255
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current behavior
      description: Include the plugin tooltip text and whether vendor software can read the battery.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: Windows version, TrafficMonitor version, plugin version
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not include a full device path, serial number, firmware, or raw HID capture.
          required: true
